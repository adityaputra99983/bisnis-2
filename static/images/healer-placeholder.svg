<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="50%" stop-color="#0d0b08"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#e8c95a"/>
      <stop offset="100%" stop-color="#8a7235"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg1)"/>
  <ellipse cx="200" cy="200" rx="180" ry="180" fill="url(#aura1)"/>
  <!-- Figure silhouette (meditating) -->
  <g transform="translate(200,220)" opacity="0.9">
    <!-- Head -->
    <circle cx="0" cy="-80" r="28" fill="url(#gold1)" opacity="0.15"/>
    <circle cx="0" cy="-80" r="20" fill="url(#gold1)" opacity="0.1"/>
    <!-- Body -->
    <path d="M-35,-52 Q-50,0 -80,40 L-60,40 Q-40,10 -20,0 Q-10,-20 0,-25 Q10,-20 20,0 Q40,10 60,40 L80,40 Q50,0 35,-52 Q20,-60 0,-62 Q-20,-60 -35,-52Z" fill="url(#gold1)" opacity="0.08"/>
    <!-- Lotus position legs -->
    <path d="M-80,40 Q-100,60 -90,80 Q-70,90 -40,70 Q-20,55 0,50 Q20,55 40,70 Q70,90 90,80 Q100,60 80,40Z" fill="url(#gold1)" opacity="0.08"/>
  </g>
  <!-- Energy rings -->
  <ellipse cx="200" cy="220" rx="120" ry="120" stroke="#c9a84c" stroke-opacity="0.08" fill="none" stroke-width="0.5" stroke-dasharray="4 8"/>
  <ellipse cx="200" cy="220" rx="160" ry="160" stroke="#c9a84c" stroke-opacity="0.06" fill="none" stroke-width="0.5" stroke-dasharray="4 8"/>
  <ellipse cx="200" cy="220" rx="195" ry="195" stroke="#c9a84c" stroke-opacity="0.04" fill="none" stroke-width="0.5" stroke-dasharray="4 8"/>
  <!-- Text -->
  <text x="200" y="440" text-anchor="middle" fill="#c9a84c" opacity="0.6" font-family="serif" font-size="14" letter-spacing="4">BALI HEALER</text>
  <text x="200" y="460" text-anchor="middle" fill="#c9a84c" opacity="0.3" font-family="sans-serif" font-size="9" letter-spacing="2">SPIRITUAL HEALING</text>
</svg>
